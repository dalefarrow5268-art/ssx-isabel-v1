name: Build Isabel Character

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-isabel-character.yml

permissions:
  contents: read

concurrency:
  group: isabel-character-build
  cancel-in-progress: true

jobs:
  build-isabel:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout Isabel review branch
        uses: actions/checkout@v4
        with:
          ref: isabel-office-review
          lfs: false

      - name: Install Blender, NumPy, and Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy git-lfs unzip curl
          blender --version
          blender --background --python-expr "import numpy; print('Blender NumPy', numpy.__version__)"
          git lfs install

      - name: Install MPFB extension
        run: |
          blender --online-mode --command extension install -s -e mpfb
          blender --command extension list | grep -i mpfb

      - name: Fetch official MakeHuman CC0 system assets
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/makehuman-assets.git "$RUNNER_TEMP/makehuman-assets"
          cd "$RUNNER_TEMP/makehuman-assets"
          git lfs pull
          test -d base/rigs
          test -d base/skins
          test -d base/hair

      - name: Install official Isabel facial packs
        run: |
          mkdir -p "$RUNNER_TEMP/functional-packs"
          curl -fL --retry 3 --retry-delay 2 https://files2.makehumancommunity.org/functional/faceunits01.zip -o "$RUNNER_TEMP/functional-packs/faceunits01.zip"
          curl -fL --retry 3 --retry-delay 2 https://files2.makehumancommunity.org/functional/visemes02.zip -o "$RUNNER_TEMP/functional-packs/visemes02.zip"
          unzip -qo "$RUNNER_TEMP/functional-packs/faceunits01.zip" -d "$RUNNER_TEMP/makehuman-assets/base"
          unzip -qo "$RUNNER_TEMP/functional-packs/visemes02.zip" -d "$RUNNER_TEMP/makehuman-assets/base"

      - name: Discover exact MPFB likeness targets
        run: |
          mkdir -p build/isabel
          blender --background --online-mode \
            --python tools/discover-isabel-mpfb-targets.py -- \
            --json build/isabel/mpfb-target-report.json
          test -s build/isabel/mpfb-target-report.json

      - name: Build Isabel GLB
        env:
          MPFB_DATA_PATH: ${{ runner.temp }}/makehuman-assets/base
        run: |
          mkdir -p public/models/isabel build/isabel
          blender --background --online-mode \
            --python tools/build-isabel-mpfb.py -- \
            --spec tools/isabel-character-spec.json \
            --likeness tools/isabel-likeness-targets.json \
            --output public/models/isabel/isabel-v1.glb \
            --save-blend build/isabel/isabel-v1.blend
          ls -lh public/models/isabel/isabel-v1.glb build/isabel/isabel-v1.blend

      - name: Validate Isabel GLB
        run: |
          blender --background --python tools/validate-isabel-glb.py -- public/models/isabel/isabel-v1.glb

      - name: Upload Isabel build artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabel-character-build
          if-no-files-found: error
          retention-days: 14
          path: |
            public/models/isabel/isabel-v1.glb
            build/isabel/isabel-v1.blend
            build/isabel/mpfb-target-report.json
            tools/isabel-character-spec.json
            tools/isabel-likeness-contract.json
            tools/isabel-likeness-targets.json
