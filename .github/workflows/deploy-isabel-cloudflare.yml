name: Deploy Isabel Cloudflare First

on:
  workflow_dispatch:
  push:
    branches:
      - isabel-live-office-poc
    paths:
      - 'app/**'
      - 'cloudflare/isabel-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/deploy-isabel-cloudflare.yml'

jobs:
  deploy-core:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Isabel core Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/isabel-core
          command: deploy --config wrangler.toml

  build-browser-office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_ISABEL_CORE_URL: ${{ vars.NEXT_PUBLIC_ISABEL_CORE_URL }}
      - name: Upload static browser office artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabel-browser-office
          path: out
          if-no-files-found: error

  deploy-pages:
    needs: build-browser-office
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: isabel-browser-office
          path: out
      - name: Deploy browser office to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=isabel-live-office-poc
