name: Deploy SSX Contact Worker

on:
  workflow_dispatch:
    inputs:
      apply_schema:
        description: "Apply legacy contact-system D1 schema before deploy"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "cloudflare/contact-system/**"
      - ".github/workflows/deploy-ssx-contact-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/contact-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Inspect contact schema before bootstrap
        run: npx wrangler d1 execute mason-forge-cloud --remote --command="SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('intake_submissions','intake_files','tasks','digest_runs','contacts','contact_messages','task_events') ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply safe intake bootstrap schema
        run: npx wrangler d1 execute mason-forge-cloud --remote --file=migrations/0003_safe_intake_bootstrap.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Inspect contact schema after bootstrap
        run: npx wrangler d1 execute mason-forge-cloud --remote --command="SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('intake_submissions','intake_files','tasks','digest_runs','contacts','contact_messages','task_events') ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply legacy base schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_schema }}
        run: npx wrangler d1 execute mason-forge-cloud --remote --file=migrations/0001.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply legacy canonical schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_schema }}
        run: npx wrangler d1 execute mason-forge-cloud --remote --file=migrations/0002_canonical_contact_system.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
