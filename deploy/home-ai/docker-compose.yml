services:
  isabel:
    build:
      context: ../..
      dockerfile: deploy/home-ai/Dockerfile
    container_name: isabel-home-ai
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ISABEL_PRIVATE_MODE: "1"
      ISABEL_PRIVATE_ROOT: /private/isabel
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${ISABEL_PRIVATE_ROOT:-./private}/models:/private/isabel/models
      - ${ISABEL_PRIVATE_ROOT:-./private}/memory:/private/isabel/memory
      - ${ISABEL_PRIVATE_ROOT:-./private}/logs:/private/isabel/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
